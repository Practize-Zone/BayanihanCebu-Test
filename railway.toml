[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs && php artisan config:cache && php artisan route:cache"

[deploy]
startCommand = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
numReplicas = 1
restartPolicyType = "on_failure"
